<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="5; url=https://theory.khoury.northeastern.edu/">
  <meta name="description" content="Cryptography and Privacy Research at Northeastern is now part of the Theoretical Computer Science Group website.">
  <title>Cryptography and Privacy Research at Northeastern</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <main class="landing-page">
    <section class="notice" aria-labelledby="page-title">
      <h1 id="page-title">Welcome to Cryptography and Privacy Research at Northeastern.</h1>
      <p>
        To learn about us, visit our Theoretical Computer Science Group website here:
        <a href="https://theory.khoury.northeastern.edu/">https://theory.khoury.northeastern.edu/</a>
      </p>
      <p class="redirect-note">
        You will be redirected automatically in <span id="countdown">5</span> seconds.
      </p>
    </section>
  </main>

  <script>
    const destination = "https://theory.khoury.northeastern.edu/";
    const countdown = document.getElementById("countdown");
    let secondsRemaining = 5;

    const timer = window.setInterval(() => {
      secondsRemaining -= 1;
      countdown.textContent = secondsRemaining;

      if (secondsRemaining <= 0) {
        window.clearInterval(timer);
        window.location.replace(destination);
      }
    }, 1000);
  </script>
</body>
</html>
